<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIMATEK — Панель начальника смены</title>
  <!-- Библиотека SheetJS для выгрузки Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #070c18; color: #f8fafc; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* Шапка */
    .header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 16px 24px; border-radius: 14px; border: 1px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 14px; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn-excel { background: #059669; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.15s; }
    .btn-excel:hover { background: #10b981; }
    .btn-refresh { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-refresh:hover { background: #334155; }
    .badge-shift { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 8px; background: #172554; color: #38bdf8; border: 1px solid #1e40af; }
    .sync-time { font-size: 12px; color: #64748b; }

    /* 4 карточки KPI сверху */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .kpi-card { background: #0f172a; border-radius: 12px; padding: 16px 20px; border: 1px solid #1e293b; border-left: 4px solid #38bdf8; }
    .kpi-title { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .kpi-value { font-size: 28px; font-weight: 900; color: #fff; }
    .kpi-sub { font-size: 12px; color: #64748b; margin-top: 4px; }

    /* Сетка линий завода */
    .section-title { font-size: 16px; font-weight: 800; color: #cbd5e1; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .lines-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .line-card { background: #0f172a; border-radius: 12px; padding: 16px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; position: relative; transition: transform 0.15s, border-color 0.15s; }
    .line-card:hover { border-color: #334155; transform: translateY(-2px); }
    .line-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 2px; }
    .line-num { font-size: 18px; font-weight: 900; color: #fff; }
    
    /* Статусные бейджи */
    .line-status { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    
    .status-work { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-work .status-dot { background: #34d399; box-shadow: 0 0 8px #34d399; }
    
    .status-clean { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-clean .status-dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    
    .status-sample { background: rgba(2, 132, 199, 0.15); color: #38bdf8; border: 1px solid rgba(2, 132, 199, 0.3); }
    .status-sample .status-dot { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    
    .status-repair { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-repair .status-dot { background: #f87171; box-shadow: 0 0 8px #f87171; }
    
    .status-idle { background: #1e293b; color: #64748b; border: 1px solid #334155; }
    .status-idle .status-dot { background: #64748b; }

    .line-row { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; }
    .line-row b { color: #f8fafc; font-weight: 700; }
    .box-badge { background: #1e293b; color: #38bdf8; font-weight: 800; padding: 2px 8px; border-radius: 6px; font-family: monospace; font-size: 13px; border: 1px solid #334155; }
    .checkpoint-badge-card { background: rgba(99, 102, 241, 0.12); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-top: 4px; display: flex; justify-content: space-between; }

    /* Таблица отчетов и переключатель вкладок */
    .table-card { background: #0f172a; border-radius: 14px; padding: 20px; border: 1px solid #1e293b; }
    .table-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 9px 16px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .tab-btn.active { background: #0072ce; color: #fff; border-color: #38bdf8; }

    .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .filters-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    .filter-select, .search-input { background: #070c18; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 13px; outline: none; }
    .search-input { width: 250px; }
    .filter-select:focus, .search-input:focus { border-color: #0072ce; }
    
    .scroll-table { overflow-x: auto; max-height: 550px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: #1e293b; color: #94a3b8; padding: 12px 14px; font-weight: 700; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #1e293b; color: #cbd5e1; white-space: nowrap; }
    tr:hover td { background: #172554; }

    .tag-ral { background: #1e293b; border: 1px solid #334155; padding: 2px 6px; border-radius: 4px; font-weight: 700; color: #38bdf8; font-size: 12px; }
    .tag-range { color: #facc15; font-family: monospace; font-weight: 800; background: rgba(250, 204, 21, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(250, 204, 21, 0.2); }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Шапка -->
  <div class="header">
    <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
      <svg width="195" height="42" viewBox="0 0 230 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="11" r="3.2" fill="#0072ce" fill-opacity="0.5"/>
        <circle cx="16" cy="11" r="3.2" fill="#0072ce" fill-opacity="0.8"/>
        <circle cx="26" cy="11" r="3.2" fill="#0072ce"/>
        <circle cx="6" cy="22" r="3.2" fill="#0072ce" fill-opacity="0.6"/>
        <circle cx="16" cy="22" r="3.2" fill="#0072ce" fill-opacity="0.9"/>
        <circle cx="26" cy="33" r="3.2" fill="#0072ce"/>
        <text x="36" y="34" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="31" fill="#0072ce" letter-spacing="1">PRIMATEK</text>
        <text x="38" y="47" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#94a3b8" letter-spacing="0.8">ИННОВАЦИИ В ПОКРЫТИЯХ</text>
      </svg>
      <span class="badge-shift" id="currentShiftBadge">СМЕНА: ДЕНЬ</span>
      <span class="sync-time" id="lastSyncTime">Обновлено: —</span>
    </div>

    <div class="header-actions">
      <button class="btn-refresh" onclick="loadDashboardData()" title="Обновить данные">🔄 Обновить</button>
      <button class="btn-excel" onclick="exportToExcel()">📊 Скачать в Excel</button>
    </div>
  </div>

  <!-- 4 плашки KPI сводки -->
  <div class="kpi-grid">
    <div class="kpi-card" style="border-left-color: #38bdf8;">
      <div class="kpi-title">ОБЩИЙ ВЫПУСК (СДАННЫЕ СМЕНЫ)</div>
      <div class="kpi-value" id="kpiGoodKg">0 кг</div>
      <div class="kpi-sub" id="kpiGoodBoxes">0 кор. / 0 меш.</div>
    </div>
    <div class="kpi-card" style="border-left-color: #f59e0b;">
      <div class="kpi-title">ЧИПСЫ</div>
      <div class="kpi-value" style="color: #fbbf24;" id="kpiChipsKg">0 кг</div>
      <div class="kpi-sub" id="kpiChipsCount">0 смен с чипсами</div>
    </div>
    <div class="kpi-card" style="border-left-color: #ef4444;">
      <div class="kpi-title">БРАК</div>
      <div class="kpi-value" style="color: #f87171;" id="kpiDefectKg">0 кг</div>
      <div class="kpi-sub" id="kpiDefectBoxes">0 коробок</div>
    </div>
    <div class="kpi-card" style="border-left-color: #94a3b8;">
      <div class="kpi-title">ПЫЛЬ</div>
      <div class="kpi-value" style="color: #cbd5e1;" id="kpiDustKg">0 кг</div>
      <div class="kpi-sub" id="kpiActiveLines">Линий: 8</div>
    </div>
  </div>

  <!-- Статус по производственным линиям -->
  <div>
    <div class="section-title">🏭 Линии завода PRIMATEK (текущее состояние линий)</div>
    <div class="lines-grid" id="linesGrid"></div>
  </div>

  <!-- Раздел журналов с вкладками -->
  <div class="table-card">
    <div class="table-tabs">
      <button id="tabBtnShifts" class="tab-btn active" onclick="switchTableTab('shifts')">📋 Журнал сдачи смен</button>
      <button id="tabBtnCheckpoints" class="tab-btn" onclick="switchTableTab('checkpoints')">⏱ Промежуточные замеры (текущий результат)</button>
    </div>

    <div class="table-toolbar">
      <div id="tableHeaderTitle" style="font-size: 15px; font-weight: 800; color: #fff;">Официальные сдачи смен</div>
      
      <!-- Панель фильтров -->
      <div class="filters-group">
        <select id="filterDate" class="filter-select" onchange="applyFilters()">
          <option value="today">Сегодня</option>
          <option value="all" selected>За все время</option>
        </select>

        <select id="filterLine" class="filter-select" onchange="applyFilters()">
          <option value="all">Все линии</option>
          <option value="1">Линия №1</option>
          <option value="5">Линия №5</option>
          <option value="6">Линия №6</option>
          <option value="7">Линия №7</option>
          <option value="8">Линия №8</option>
          <option value="13">Линия №13</option>
          <option value="14">Линия №14</option>
          <option value="15">Линия №15</option>
        </select>

        <input type="text" id="searchInput" class="search-input" placeholder="Поиск (оператор, RAL, партия)..." oninput="applyFilters()">
      </div>
    </div>

    <div class="scroll-table">
      <table id="mainTable">
        <thead id="tableHead">
          <!-- Генерируется скриптом -->
        </thead>
        <tbody id="reportsTableBody">
          <tr><td colspan="12" style="text-align: center; color: #64748b; padding: 25px;">Загрузка данных...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const SUPABASE_BASE = "https://oqhrzruxubqthqyxmdcg.supabase.co/rest/v1";
  const SUPABASE_KEY = "sb_publishable_m5YmzYjW1BpotrbaRpCdgA__kYvilf3";
  const PRIMATEK_LINES = [1, 5, 6, 7, 8, 13, 14, 15];

  let allReports = [];
  let currentActiveTab = 'shifts'; // 'shifts' или 'checkpoints'

  function updateShiftHeader() {
    const h = new Date().getHours();
    const isDay = (h >= 8 && h < 20);
    document.getElementById('currentShiftBadge').innerText = 'СМЕНА: ' + (isDay ? 'ДЕНЬ (08:00 - 20:00)' : 'НОЧЬ (20:00 - 08:00)');
  }
  updateShiftHeader();

  function isCheckpointReport(r) {
    return (r.shift_type || '').includes('ТЕКУЩИЙ');
  }

  function getBoxRange(r) {
    const start = r.unit_from || r.box_from || r.start_box || null;
    const end = r.unit_to || r.box_to || r.end_box || null;
    const count = Number(r.good_boxes || r.good_bags) || 0;

    if (start && end) {
      return { text: `№ ${start} — № ${end}`, count: (end - start + 1) };
    }
    if (end && count) {
      const calcStart = Math.max(1, end - count + 1);
      return { text: `№ ${calcStart} — № ${end}`, count: count };
    }
    if (count > 0) {
      return { text: `${count} шт.`, count: count };
    }
    return { text: '—', count: 0 };
  }

  function switchTableTab(tab) {
    currentActiveTab = tab;
    document.getElementById('tabBtnShifts').classList.toggle('active', tab === 'shifts');
    document.getElementById('tabBtnCheckpoints').classList.toggle('active', tab === 'checkpoints');
    document.getElementById('tableHeaderTitle').innerText = tab === 'shifts' 
      ? 'Официальные сдачи смен (итоговые закрытия)' 
      : 'Промежуточные замеры темпа линий (текущий результат)';
    applyFilters();
  }

  async function loadDashboardData() {
    try {
      const res = await fetch(`${SUPABASE_BASE}/shift_reports?select=*&order=created_at.desc`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      if (res.ok) {
        allReports = await res.json();
        document.getElementById('lastSyncTime').innerText = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
        renderKPIs(allReports);
        renderLineCards(allReports);
        applyFilters();
      }
    } catch (e) {
      console.error("Ошибка загрузки данных:", e);
    }
  }

  // В сводке KPI считаем ТОЛЬКО закрытые сдачи смен
  function renderKPIs(reports) {
    let totalGoodKg = 0;
    let totalBoxes = 0;
    let totalBags = 0;
    let totalChipsKg = 0;
    let totalDefectKg = 0;
    let totalDefectBoxes = 0;
    let totalDustKg = 0;

    const closedShifts = reports.filter(r => !isCheckpointReport(r));

    closedShifts.forEach(r => {
      totalGoodKg += Number(r.total_good_kg) || 0;
      totalBoxes += Number(r.good_boxes) || 0;
      totalBags += Number(r.good_bags) || 0;
      totalChipsKg += Number(r.chips_kg) || 0;
      totalDefectKg += Number(r.defect_kg) || 0;
      totalDefectBoxes += Number(r.defect_boxes) || 0;
      totalDustKg += Number(r.dust_kg) || 0;
    });

    document.getElementById('kpiGoodKg').innerText = totalGoodKg.toLocaleString('ru-RU') + ' кг';
    document.getElementById('kpiGoodBoxes').innerText = `${totalBoxes} кор. / ${totalBags} меш.`;
    document.getElementById('kpiChipsKg').innerText = totalChipsKg.toLocaleString('ru-RU') + ' кг';
    document.getElementById('kpiChipsCount').innerText = `${closedShifts.filter(r => (Number(r.chips_kg)||0) > 0).length} смен с чипсами`;
    document.getElementById('kpiDefectKg').innerText = totalDefectKg.toLocaleString('ru-RU') + ' кг';
    document.getElementById('kpiDefectBoxes').innerText = `${totalDefectBoxes} коробок`;
    document.getElementById('kpiDustKg').innerText = totalDustKg.toFixed(1) + ' кг';
  }

  function renderLineCards(reports) {
    const grid = document.getElementById('linesGrid');
    grid.innerHTML = '';

    PRIMATEK_LINES.forEach(lineNum => {
      // Ищем последнюю закрытую смену
      const latestShift = reports.find(r => Number(r.line_number) === lineNum && !isCheckpointReport(r));
      // Ищем самый свежий промежуточный замер
      const latestCheckpoint = reports.find(r => Number(r.line_number) === lineNum && isCheckpointReport(r));

      let statusClass = 'status-idle';
      let statusText = 'НЕТ ДАННЫХ';
      let op = '—';
      let batch = '—';
      let ral = '—';
      let output = '—';
      let boxInfo = '—';

      const baseRecord = latestShift || latestCheckpoint;

      if (baseRecord) {
        statusText = baseRecord.line_status || 'В РАБОТЕ';
        if (statusText === 'В РАБОТЕ') statusClass = 'status-work';
        else if (statusText === 'ЧИСТКА') statusClass = 'status-clean';
        else if (statusText === 'ПРОБЫ') statusClass = 'status-sample';
        else if (statusText === 'РЕМОНТ') statusClass = 'status-repair';

        op = baseRecord.operator_name || '—';
        batch = baseRecord.batch_number || '—';
        ral = baseRecord.ral_color || '—';

        if (latestShift) {
          output = `${latestShift.total_good_kg || 0} кг`;
          const bInfo = getBoxRange(latestShift);
          boxInfo = (statusText === 'В РАБОТЕ') ? `<span class="box-badge">${bInfo.text}</span>` : `<span style="color:#94a3b8;">${statusText}</span>`;
        }
      }

      // Проверяем, есть ли свежий промежуточный замер сделанный ПОЗЖЕ последней сдачи смены
      let checkpointHtml = '';
      if (latestCheckpoint) {
        const cpTime = new Date(latestCheckpoint.created_at).getTime();
        const shiftTime = latestShift ? new Date(latestShift.created_at).getTime() : 0;

        if (cpTime > shiftTime) {
          const tStr = new Date(latestCheckpoint.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
          const cpBox = getBoxRange(latestCheckpoint);
          checkpointHtml = `
            <div class="checkpoint-badge-card">
              <span>⏱ Замер в ${tStr} (${cpBox.text}):</span>
              <b>${latestCheckpoint.total_good_kg || 0} кг</b>
            </div>
          `;
        }
      }

      const card = document.createElement('div');
      card.className = 'line-card';
      card.innerHTML = `
        <div class="line-card-header">
          <span class="line-num">Линия №${lineNum}</span>
          <span class="line-status ${statusClass}"><span class="status-dot"></span>${statusText}</span>
        </div>
        <div class="line-row"><span>Оператор:</span><b>${op}</b></div>
        <div class="line-row"><span>Партия / RAL:</span><b>${batch} (${ral})</b></div>
        <div class="line-row"><span>Коробки:</span>${boxInfo}</div>
        <div class="line-row" style="margin-top: 4px; border-top: 1px solid #1e293b; padding-top: 6px;">
          <span>Сдано в смену:</span><b style="color: #38bdf8; font-size: 15px;">${output}</b>
        </div>
        ${checkpointHtml}
      `;
      grid.appendChild(card);
    });
  }

  function applyFilters() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
    const lineVal = document.getElementById('filterLine').value;
    const dateVal = document.getElementById('filterDate').value;
    const todayStr = new Date().toISOString().slice(0, 10);

    const filtered = allReports.filter(r => {
      // 1. Фильтр вкладки: сдачи смен или замеры
      const isCp = isCheckpointReport(r);
      if (currentActiveTab === 'shifts' && isCp) return false;
      if (currentActiveTab === 'checkpoints' && !isCp) return false;

      // 2. Поиск по тексту
      const op = (r.operator_name || '').toLowerCase();
      const batch = (r.batch_number || '').toLowerCase();
      const ral = (r.ral_color || '').toLowerCase();
      const matchSearch = !searchVal || op.includes(searchVal) || batch.includes(searchVal) || ral.includes(searchVal);

      // 3. Линия
      const matchLine = (lineVal === 'all') || (String(r.line_number) === String(lineVal));

      // 4. Дата
      let matchDate = true;
      if (dateVal === 'today' && r.created_at) {
        matchDate = r.created_at.slice(0, 10) === todayStr;
      }

      return matchSearch && matchLine && matchDate;
    });

    renderTable(filtered);
  }

  function renderTable(reports) {
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('reportsTableBody');

    if (currentActiveTab === 'shifts') {
      thead.innerHTML = `
        <tr>
          <th>Время сдачи</th>
          <th>Линия</th>
          <th>Смена</th>
          <th>Оператор</th>
          <th>Партия</th>
          <th>Цвет RAL</th>
          <th>Статус</th>
          <th>Диапазон коробок</th>
          <th>Сдано (кг)</th>
          <th>Чипсы</th>
          <th>Брак</th>
          <th>Пыль</th>
        </tr>
      `;
    } else {
      thead.innerHTML = `
        <tr>
          <th>Время замера</th>
          <th>Линия</th>
          <th>Текущая смена</th>
          <th>Оператор</th>
          <th>Партия</th>
          <th>Цвет RAL</th>
          <th>Статус</th>
          <th>Текущие коробки</th>
          <th>Намолочено к этому часу</th>
          <th>Чипсы</th>
        </tr>
      `;
    }

    if (!reports.length) {
      const colCount = currentActiveTab === 'shifts' ? 12 : 10;
      tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; color: #64748b; padding: 25px;">Записей в этой категории не найдено</td></tr>`;
      return;
    }

    tbody.innerHTML = reports.map(r => {
      const dt = new Date(r.created_at);
      const timeStr = dt.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'}) + ' ' + dt.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});

      const status = r.line_status || 'В РАБОТЕ';
      let statusBadge = `<span class="line-status status-work"><span class="status-dot"></span>В РАБОТЕ</span>`;
      if (status === 'ЧИСТКА') statusBadge = `<span class="line-status status-clean"><span class="status-dot"></span>ЧИСТКА</span>`;
      if (status === 'ПРОБЫ') statusBadge = `<span class="line-status status-sample"><span class="status-dot"></span>ПРОБЫ</span>`;
      if (status === 'РЕМОНТ') statusBadge = `<span class="line-status status-repair"><span class="status-dot"></span>РЕМОНТ</span>`;

      const box = getBoxRange(r);
      const boxHtml = (box.text !== '—') ? `<span class="tag-range">${box.text}</span>` : `<span style="color:#64748b;">—</span>`;

      if (currentActiveTab === 'shifts') {
        return `
          <tr>
            <td style="color: #94a3b8; font-family: monospace;">${timeStr}</td>
            <td><b>№${r.line_number}</b></td>
            <td>${r.shift_type || '—'}</td>
            <td><b>${r.operator_name || '—'}</b></td>
            <td>${r.batch_number || '—'}</td>
            <td><span class="tag-ral">${r.ral_color || '—'}</span></td>
            <td>${statusBadge}</td>
            <td>${boxHtml}</td>
            <td><b style="color: #34d399; font-size:14px;">${r.total_good_kg || 0} кг</b></td>
            <td style="color: #fbbf24;">${r.chips_kg || 0} кг</td>
            <td style="color: #f87171;">${r.defect_kg || 0} кг</td>
            <td>${Number(r.dust_kg || 0).toFixed(1)} кг</td>
          </tr>
        `;
      } else {
        const cleanShift = (r.shift_type || '').replace('ТЕКУЩИЙ (','').replace(')','');
        return `
          <tr style="background: rgba(99, 102, 241, 0.05);">
            <td style="color: #a5b4fc; font-family: monospace; font-weight:700;">⏱ ${timeStr}</td>
            <td><b>№${r.line_number}</b></td>
            <td>${cleanShift}</td>
            <td><b>${r.operator_name || '—'}</b></td>
            <td>${r.batch_number || '—'}</td>
            <td><span class="tag-ral">${r.ral_color || '—'}</span></td>
            <td>${statusBadge}</td>
            <td>${boxHtml}</td>
            <td><b style="color: #a5b4fc; font-size:14px;">${r.total_good_kg || 0} кг</b></td>
            <td style="color: #fbbf24;">${r.chips_kg || 0} кг</td>
          </tr>
        `;
      }
    }).join('');
  }

  function exportToExcel() {
    const exportDataList = allReports.filter(r => !isCheckpointReport(r));
    if (!exportDataList.length) {
      alert("Нет данных для выгрузки");
      return;
    }

    const excelData = exportDataList.map(r => {
      const box = getBoxRange(r);
      return {
        "Дата и время": new Date(r.created_at).toLocaleString('ru-RU'),
        "Линия": "№" + r.line_number,
        "Смена": r.shift_type || "",
        "Оператор": r.operator_name || "",
        "Партия": r.batch_number || "",
        "Цвет RAL": r.ral_color || "",
        "Состояние линии": r.line_status || "В РАБОТЕ",
        "Диапазон": box.text,
        "Коробок/Мешков": box.count || 0,
        "Выпуск (кг)": r.total_good_kg || 0,
        "Чипсы (кг)": r.chips_kg || 0,
        "Брак (кг)": r.defect_kg || 0,
        "Пыль (кг)": r.dust_kg || 0
      };
    });

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Отчеты смен PRIMATEK");

    const fileName = `PRIMATEK_Смены_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }

  loadDashboardData();
  setInterval(loadDashboardData, 30000);
</script>

</body>
</html>
